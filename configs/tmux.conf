# ~/.config/tmux/tmux.conf — config de tmux para el workspace
set -g default-terminal "xterm-256color"
set-option -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 5000

# ==== Responsive / tamaño de ventana ====
# La sesion se crea detached (80x24) y desde una terminal minimizada queda mal.
# Esto fuerza a que la ventana siga SIEMPRE el tamaño del cliente conectado.
set -g window-size latest
set -g aggressive-resize on
# Re-ajusta la ventana al cliente mas grande al instante (atajo manual si se ve roto)
bind R resize-window -A \; refresh-client -C ; display "Ventana re-ajustada"

# Bindings familiares
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind '[' copy-mode
bind ']' paste-buffer
bind r source-file ~/.config/tmux/tmux.conf \; display "Config re-cargada"

# Ventanas/panes
bind c new-window
bind % split-window -h
bind '"' split-window -v
bind n next-window
bind p previous-window

# Colores razonables
set -g status-style 'bg=#1a1b26,fg=#c0caf5'
set -g window-status-current-style 'fg=#1a1b26,bg=#7aa2f7'
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'